name: Render social preview JPG

on:
  push:
    branches:
      - fix/profile-photo-and-social-preview
    paths:
      - og-cover.svg
      - .github/workflows/render-og-cover.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: fix/profile-photo-and-social-preview
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rasterize the existing social card
        run: |
          npm install --no-save sharp
          node -e "const sharp=require('sharp'); sharp('og-cover.svg').jpeg({quality:90, mozjpeg:true}).toFile('og-cover.jpg').then(async info => { const meta=await sharp('og-cover.jpg').metadata(); if(meta.width!==1200 || meta.height!==630) throw new Error('Unexpected dimensions: '+meta.width+'x'+meta.height); console.log(info); })"
      - name: Commit JPG output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-cover.jpg
          if git diff --cached --quiet; then
            echo "No social image changes."
          else
            git commit -m "Generate WhatsApp-compatible social preview JPG"
            git push
          fi
